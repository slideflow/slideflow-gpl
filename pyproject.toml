[build-system]
requires = ["setuptools>=61", "versioneer[toml]>=0.29"]
build-backend = "setuptools.build_meta"

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "slideflow_gpl/_version.py"
versionfile_build = "slideflow_gpl/_version.py"
tag_prefix = ""
parentdir_prefix = "slideflow-gpl-"
